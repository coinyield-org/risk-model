notes: "Avi Eisenberg (previously responsible for the Mango Markets exploit) borrowed large amounts of CRV on Aave V2 and short-sold them to suppress the CRV price below liquidation thresholds, deliberately attempting to create bad debt in the Aave CRV market. The Aave community passed an emergency governance vote to freeze the CRV market; ~$1.6M in bad debt materialized before the position was unwound, highlighting the conflict between emergency speed and governance process."
