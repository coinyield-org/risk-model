notes: >-
  OUT OF SCOPE. Root cause was a reentrancy bug in the _harvestBatchMarketRewards
  function, which lacked a reentrancy guard. The attacker registered a fake
  Pendle market (Penpie allowed permissionless market registration), then
  re-entered the harvest function during reward calculation to artificially
  inflate flash-loaned token balances and claim inflated rewards, draining
  $27M. This is a code-level reentrancy/access-control bug; the permissionless
  market registration was the enabling condition but the exploitable flaw is
  in the contract logic.
