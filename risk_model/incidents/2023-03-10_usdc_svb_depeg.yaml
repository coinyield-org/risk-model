notes: "Circle disclosed $3.3B of USDC reserves held at Silicon Valley Bank when the FDIC seized the institution; with redemptions suspended over the weekend, USDC depegged to $0.87 on secondary markets. The depeg propagated across DeFi via Curve 3pool imbalance and MakerDAO PSM drain; the peg fully recovered after the US government guaranteed all SVB deposits on Monday."
