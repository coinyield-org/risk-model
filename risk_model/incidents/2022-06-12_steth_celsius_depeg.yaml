notes: "Celsius, the largest stETH holder, faced a liquidity crisis and was forced to sell stETH on secondary markets. Because Lido withdrawals were not yet available (pre-Shanghai upgrade), the only exit was the Curve stETH/ETH pool, which became severely imbalanced; stETH traded as low as 0.94 ETH. The peg eventually recovered after Ethereum's Shanghai upgrade enabled withdrawals."
