notes: "Arbitrum's sequencer went offline for approximately 1.5 hours, during which Chainlink oracle price feeds continued serving the last recorded prices. Protocols that had not integrated the Chainlink L2 sequencer uptime feed were exposed to potential price-staleness exploits; Aave's sequencer guard prevented exploitation in this instance, making this a confirmed near-miss."
