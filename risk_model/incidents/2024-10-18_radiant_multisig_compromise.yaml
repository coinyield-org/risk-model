notes: "Malware on the devices of three Radiant Capital multisig signers intercepted and replaced legitimate transaction signatures, allowing the attacker to satisfy the 3-of-11 threshold and push malicious smart contract upgrades across both BSC and Arbitrum deployments. The attacker then drained $55M through the upgraded contracts, demonstrating that proxy upgrade authority combined with compromised endpoint security can bypass multisig threshold guarantees."
