notes: "Attacker used a flash loan to borrow enough governance tokens (Stalk) to achieve a supermajority in a single block, then executed a pre-staged malicious proposal that drained the protocol treasury in the same transaction. Beanstalk's governance used spot token balances with no time-lock or time-weighted averaging, making it trivially vulnerable to flash-loan-powered hostile takeover."
