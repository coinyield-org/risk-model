notes: "Solana mainnet halted for approximately 8 hours due to a consensus instability bug triggered by a misconfigured validator; all Solana DeFi protocols including lending markets and perpetuals were frozen. On chain restart, oracle feeds served stale pre-halt prices until they could resynchronize, briefly exposing lending protocols to mispriced collateral."
